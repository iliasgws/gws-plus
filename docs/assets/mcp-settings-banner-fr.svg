<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Greenwood School Plus prend désormais en charge les MCP</title>
  <desc id="desc">Bannière française annonçant la connexion gratuite et chiffrée d'assistants IA via MCP.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d55c7"/>
      <stop offset="0.55" stop-color="#0878c6"/>
      <stop offset="1" stop-color="#20c79f"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63f0a5"/>
      <stop offset="1" stop-color="#22d7c8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00356f" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="400" rx="42" fill="url(#bg)"/>
  <path d="M600 400C700 280 810 320 900 245c90-75 145-230 300-220v375z" fill="#34d9b1" opacity="0.14"/>
  <path d="M705 0c80 95 180 58 255 115 70 54 98 120 240 90V0z" fill="#5adbcf" opacity="0.12"/>

  <g font-family="Inter, Arial, sans-serif" fill="#fff">
    <g transform="translate(48 40)">
