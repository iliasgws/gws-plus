    <path d="M210 34l112 44v93c0 78-48 134-112 161-64-27-112-83-112-161V78z" fill="url(#mint)" stroke="#dffff6" stroke-width="7"/>
    <rect x="177" y="150" width="66" height="61" rx="12" fill="#fff" opacity="0.98"/>
