    <circle cx="210" cy="179" r="7" fill="#0fae83"/>
    <path d="M66 170h88" stroke="#b8f2ff" stroke-width="12" stroke-linecap="round"/>
    <path d="M275 88c40-48 73-55 112-41M278 246c50 32 77 44 115 42" fill="none" stroke="#b8f2ff" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
    <circle cx="48" cy="170" r="36" fill="#eafaff"/>
    <path d="M25 170h23l18-18v36l-18-18" fill="#1686dc" opacity="0.92"/>
    <circle cx="390" cy="43" r="31" fill="#eafaff"/>
    <text x="390" y="50" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#145580">AI</text>
    <circle cx="399" cy="288" r="31" fill="#eafaff"/>
    <path d="M383 291a11 11 0 1122 0v6h-22zm22-6a8 8 0 1116 0v12h-11v-6c0-3-2-5-5-6z" fill="#1591c4"/>
