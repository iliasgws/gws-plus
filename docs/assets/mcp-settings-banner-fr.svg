        <path d="M18 34C10 15 20 3 41 3c1 18-6 29-23 31z" fill="url(#mint)"/>
        <path d="M28 34C31 12 45 7 61 15c-5 16-15 22-33 19z" fill="#62efaa"/>
        <rect x="26" y="29" width="6" height="29" rx="3" fill="#50e9b2"/>
      </g>
      <text x="78" y="38" font-size="38" font-weight="800">Greenwood <tspan fill="#52e6b2">School Plus</tspan></text>
    </g>

    <text x="48" y="150" font-size="54" font-weight="900">Prend désormais en charge les <tspan fill="#53e9b7">MCP</tspan></text>
    <text x="48" y="202" font-size="28" font-weight="500" opacity="0.97">Connectez des assistants IA à votre compte scolaire</text>

    <g transform="translate(48 228)" font-size="22" font-weight="700">
      <g>
        <rect width="185" height="58" rx="29" fill="#073c77" opacity="0.92"/>
        <circle cx="31" cy="29" r="21" fill="#17bd89"/>
        <text x="31" y="36" text-anchor="middle" font-size="20">AI</text>
        <text x="64" y="37">ChatGPT</text>
      </g>
      <g transform="translate(202 0)">
        <rect width="165" height="58" rx="29" fill="#073c77" opacity="0.92"/>
        <circle cx="31" cy="29" r="21" fill="#ee6a4a"/>
        <g stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.9">
          <path d="M31 12v34M14 29h34M19 17l24 24M43 17L19 41"/>
        </g>
        <text x="64" y="37">Claude</text>
      </g>
      <g transform="translate(384 0)">
        <rect width="132" height="58" rx="29" fill="#073c77" opacity="0.92"/>
        <circle cx="31" cy="29" r="21" fill="#fff" opacity="0.95"/>
        <path d="M20 23l8-8 12 12-8 8-12-12zm7 12 8 8 12-12-8-8" fill="none" stroke="#103d70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="64" y="37">MCP</text>
      </g>
    </g>

    <g transform="translate(48 302)" font-size="21" font-weight="750">
      <g>
        <rect width="150" height="54" rx="27" fill="#073c77" opacity="0.9"/>
        <circle cx="29" cy="27" r="20" fill="#1dd09c"/>
        <path d="M20 24h18v15H20zM29 20v19M18 24h22M23 20c-6-5 1-10 6-3 5-7 12-2 6 3" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <text x="60" y="35">Gratuit</text>
      </g>
      <g transform="translate(168 0)">
        <rect width="170" height="54" rx="27" fill="#073c77" opacity="0.9"/>
        <circle cx="29" cy="27" r="20" fill="#1dd09c"/>
        <rect x="21" y="24" width="16" height="14" rx="3" fill="#fff"/>
        <path d="M24 24v-5a5 5 0 0110 0v5" fill="none" stroke="#fff" stroke-width="3"/>
        <text x="60" y="35">Chiffré</text>
      </g>
